name: Build Fahriu Travel APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**','web/**','build.gradle.kts','settings.gradle.kts','gradle.properties','.github/workflows/android-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Copy app pages into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp web/*.html app/src/main/assets/
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fahriu-Travel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
