name = "fahriu-umra-api"
main = "src/index.js"
compatibility_date = "2026-11-03"

[vars]
OPENAI_MODEL = "gpt-4.1-mini"
# Configure ALLOWED_ORIGINS in Cloudflare for the exact production app origin(s).
# Store OPENAI_API_KEY only as a Cloudflare Secret.

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
