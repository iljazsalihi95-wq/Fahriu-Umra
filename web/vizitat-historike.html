<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vizitat historike | Fahriu Travel</title>
<style>:root{--bg:#061813;--gold:#e7c46b;--paper:#f7f2e8;--ink:#19352a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.65 system-ui,Arial;color:var(--ink)}header{background:linear-gradient(125deg,#061813e8,#124634de),url('https://dn711109.ca.archive.org/0/items/fahriu-travel-komplet-foto-video-vizita-26-08-2026/IMG-20260827-WA0001.jpg') center/cover;color:white;padding:30px 18px 42px;border-bottom:3px solid var(--gold)}header>div,main{max-width:1050px;margin:auto}h1{font:700 clamp(30px,5vw,49px) Georgia;color:var(--gold);margin:12px 0}header p{max-width:740px}.tools{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}button,.map{border:1px solid #b6954a;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer;background:#0b3b2b;color:white;text-decoration:none}.active{background:var(--gold);color:#19352a}main{padding:18px 13px 45px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:15px}.card{background:var(--paper);border:1px solid #d9c89d;border-radius:19px;padding:20px;box-shadow:0 8px 25px #0002}.tag{color:#80621f;font-size:12px;font-weight:800;letter-spacing:.09em}.card h2{font:700 25px Georgia;margin:8px 0}.card h3{font-size:14px;color:#136044;margin:18px 0 5px}.card p{margin:0 0 9px}.card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.card button{background:#12533e}.map{display:inline-flex;align-items:center;background:#d6b55d;color:#122c23}.sources{font-size:12px;color:#5d6b64;border-top:1px solid #d7cdb6;padding-top:10px;margin-top:14px}footer{color:#e2d4a3;text-align:center;padding:20px}button:focus-visible,a:focus-visible{outline:3px solid #e8c75b;outline-offset:3px}</style></head>
<body><header><div><strong>FAHRIU TRAVEL · UDHËTIMI YT DREJT UMRES</strong><h1 id="heading">Vizitat historike</h1><p id="intro">Udhëzues dygjuhësh për vendet e lidhura me historinë islame. Shpjegime, orientim dhe lexim me zë.</p><div class="tools"><button id="sq" class="active" onclick="setLang('sq')">Shqip</button><button id="de" onclick="setLang('de')">Deutsch</button><button onclick="stopSpeech()" id="stop">■ Ndalo leximin</button></div></div></header><main><div class="tools" style="margin:0 0 18px"><button id="all" class="active" onclick="setCity('all')">Të gjitha</button><button id="medine" onclick="setCity('medine')">Medinë</button><button id="meke" onclick="setCity('meke')">Mekë</button><button id="taif" onclick="setCity('taif')">Taif</button></div><section id="cards" class="cards" aria-live="polite"></section></main><footer>© Fahriu Travel · Burimet historike duhen krahasuar me librin origjinal para publikimit përfundimtar.</footer>
<script>
const places=[
{id:'kuba',city:'medine',map:'https://www.google.com/maps/search/?api=1&query=Quba+Mosque+Medina',sq:{title:'Xhamia Kuba',intro:'Xhamia Kuba lidhet me mbërritjen e Profetit Muhamed ﷺ në zonën e Medinës gjatë Hixhretit. Ajo njihet si xhamia e parë e themeluar në Islam.',history:'Gjatë udhëtimit nga Meka drejt Medinës, Profeti ﷺ qëndroi në Kuba para hyrjes në qendrën e Medinës. Tradita islame e lidh themelimin e xhamisë me këtë qëndrim. Kuba nuk është thjesht një monument: ajo kujton fillimin e jetës së bashkësisë myslimane në Medinë dhe organizimin e saj rreth adhurimit.',significance:'Në Sahih Muslim transmetohet se Profeti ﷺ e vizitonte xhaminë Kuba, herë në këmbë dhe herë hipur, dhe falte namaz aty. Ekziston gjithashtu transmetimi për shpërblimin e namazit në Kuba pas pastrimit në shtëpi, i raportuar në Sunen Ibn Maxhe; gradimi dhe formulimi duhet kontrolluar sipas botimit të përdorur.',visit:'Vizita mund të përfshijë njohjen me historinë e Hixhretit dhe faljen e namazit, pa e konsideruar atë pjesë të detyrueshme të Umres.',source:'Kurani 9:108 (interpretimi i lidhjes me Kuban është temë tefsiri); Sahih Muslim, kapitujt mbi xhaminë Kuba.'},de:{title:'Qubā-Moschee',intro:'Die Qubā-Moschee ist mit der Ankunft des Propheten Muhammad ﷺ im Gebiet von Medina während der Hidschra verbunden. Sie gilt als die erste im Islam gegründete Moschee.',history:'Auf seiner Auswanderung von Mekka nach Medina hielt sich der Prophet ﷺ zunächst in Qubā auf. Die islamische Überlieferung verbindet die Gründung der Moschee mit diesem Aufenthalt. Sie erinnert an den Beginn des gemeinschaftlichen Lebens der Muslime in Medina und an die zentrale Rolle des Gebets.',significance:'In Sahih Muslim wird überliefert, dass der Prophet ﷺ die Qubā-Moschee zu Fuß oder reitend besuchte und dort betete. Eine weitere Überlieferung berichtet von einem besonderen Lohn für das Gebet nach der rituellen Reinigung zu Hause; Wortlaut und Einstufung sollten anhand der verwendeten Ausgabe geprüft werden.',visit:'Ein Besuch kann die Geschichte der Hidschra und ein freiwilliges Gebet einschließen. Er ist keine Pflicht der Umra.',source:'Koran 9:108 (die Zuordnung zu Qubā ist eine Frage der Exegese); Sahih Muslim, Abschnitte zur Qubā-Moschee.'}},
{id:'uhud',city:'medine',map:'https://www.google.com/maps/search/?api=1&query=Mount+Uhud+Medina',sq:{title:'Mali i Uhudit',intro:'Uhudi është vendi i betejës së vitit 3 hixhri (625 e.s.), një prej ngjarjeve më të rëndësishme të historisë së hershme islame.',history:'Në betejën e Uhudit, myslimanët u përballën me ushtrinë mekase. Një grup harkëtarësh ishte vendosur në një pozicion mbrojtës me urdhër të mos e braktisnin. Kur një pjesë e tyre u largua nga vendi, rrjedha e betejës ndryshoi. Ngjarja trajtohet në Kuran si mësim mbi bindjen, qëndrueshmërinë dhe pasojat e gabimeve.',significance:'Në Uhud ranë dëshmorë disa sahabë, përfshirë Hamzain r.a. Vizita shërben për të kuptuar historinë dhe sakrificën, jo për t’i atribuuar vendit rite që nuk kanë bazë.',visit:'Respektoni rregullat e zonës, shmangni ngjitjet e rrezikshme dhe mos pengoni vizitorët e tjerë.',source:'Kurani 3:121–180; Sahih el-Buhari, rrëfimet për betejën e Uhudit.'},de:{title:'Berg Uhud',intro:'Uhud ist der Schauplatz der Schlacht im Jahr 3 n. H. (625 n. Chr.), eines zentralen Ereignisses der frühen islamischen Geschichte.',history:'Bei Uhud trafen die Muslime auf das Heer aus Mekka. Eine Gruppe von Bogenschützen sollte eine strategische Stellung halten. Als ein Teil diese Stellung verließ, änderte sich der Verlauf der Schlacht. Der Koran behandelt das Ereignis als Lehre über Gehorsam, Standhaftigkeit und die Folgen von Fehlentscheidungen.',significance:'Unter den Gefallenen war Hamza, ein Onkel des Propheten ﷺ. Der Besuch dient dem historischen Verständnis und der Erinnerung an die Opfer, nicht der Einführung zusätzlicher religiöser Riten.',visit:'Die örtlichen Regeln beachten, gefährliche Aufstiege vermeiden und andere Besucher nicht behindern.',source:'Koran 3:121–180; Sahih al-Bukhari, Berichte über Uhud.'}},
{id:'hira',city:'meke',map:'https://www.google.com/maps/search/?api=1&query=Jabal+al+Nour+Hira+Mecca',sq:{title:'Shpella Hira dhe Xhebel en-Nur',intro:'Shpella Hira njihet si vendi ku Profeti Muhamed ﷺ mori shpalljen e parë të Kuranit.',history:'Para fillimit të shpalljes, Profeti ﷺ tërhiqej në Hira për përkushtim dhe reflektim. Sipas transmetimit të Aishes r.a. në Sahih el-Buhari, aty erdhi engjëlli Xhibril me urdhrin “Lexo”. Kjo ngjarje shënon fillimin e shpalljes profetike. Ajetet e para të sures El-Alak lidhen me këtë moment.',significance:'Hira ka rëndësi të madhe historike, por ngjitja në shpellë nuk është rit i Umres dhe nuk kërkohet për plotësimin e saj.',visit:'Terreni është i pjerrët dhe mund të jetë i vështirë, veçanërisht në vapë. Përparësi ka siguria; nuk ka nevojë të ngjiteni për të përfituar nga mësimi historik.',source:'Kurani 96:1–5; Sahih el-Buhari, Hadithi i fillimit të shpalljes.'},de:{title:'Höhle Hirā und Dschabal an-Nūr',intro:'Die Höhle Hirā gilt als der Ort, an dem der Prophet Muhammad ﷺ die erste koranische Offenbarung empfing.',history:'Vor Beginn der Offenbarung zog sich der Prophet ﷺ nach Hirā zurück. Nach dem Bericht von Aischa in Sahih al-Bukhari erschien ihm dort der Engel Dschibril mit der Aufforderung „Lies!“. Dieses Ereignis markiert den Beginn der prophetischen Offenbarung. Die ersten Verse der Sure al-ʿAlaq werden damit verbunden.',significance:'Hirā besitzt große historische Bedeutung. Der Aufstieg zur Höhle gehört jedoch nicht zu den Riten der Umra und ist für deren Gültigkeit nicht erforderlich.',visit:'Der Weg ist steil und bei Hitze anstrengend. Sicherheit geht vor; ein Aufstieg ist für das historische Verständnis nicht notwendig.',source:'Koran 96:1–5; Sahih al-Bukhari, Bericht über den Beginn der Offenbarung.'}},
{id:'taif',city:'taif',map:'https://www.google.com/maps/search/?api=1&query=Taif+Saudi+Arabia',sq:{title:'Taifi dhe sprova e thirrjes',intro:'Taifi lidhet me një periudhë të vështirë të thirrjes së Profetit Muhamed ﷺ, kur ai kërkoi mbështetje jashtë Mekës.',history:'Në rrëfimet e sirës, Profeti ﷺ shkoi në Taif për të përcjellë mesazhin e Islamit dhe për të kërkuar përkrahje. Ai u përball me refuzim. Në Sahih el-Buhari dhe Sahih Muslim, Aishja r.a. transmeton përgjigjen e tij kur iu ofrua ndëshkimi i banorëve: ai shprehu shpresën që prej pasardhësve të tyre të dilnin njerëz që adhuronin Allahun.',significance:'Ngjarja është shembull i durimit, mëshirës dhe shpresës në thirrje. Nuk duhet ngatërruar historia e Taifit me ritualet e detyrueshme të Umres.',visit:'Gjatë vizitës dalloni vendet historikisht të dokumentuara nga emërtimet turistike moderne. Mos paraqitni si të sigurta vendndodhje që nuk janë verifikuar.',source:'Sahih el-Buhari dhe Sahih Muslim, hadithi i Aishes për ditën më të rëndë të Profetit ﷺ; literatura e sirës.'},de:{title:'Taif und die Prüfung der Verkündigung',intro:'Taif ist mit einer schwierigen Phase der Verkündigung des Propheten Muhammad ﷺ verbunden, als er außerhalb Mekkas Unterstützung suchte.',history:'Nach den Berichten der Sira reiste der Prophet ﷺ nach Taif, um die Botschaft des Islam zu verkünden und Unterstützung zu finden. Er stieß auf Ablehnung. In Sahih al-Bukhari und Sahih Muslim berichtet Aischa, dass er trotz des erlittenen Unrechts hoffte, aus den Nachkommen der Menschen würden Gläubige hervorgehen.',significance:'Das Ereignis steht für Geduld, Barmherzigkeit und Hoffnung. Die Geschichte Taifs ist von den verpflichtenden Riten der Umra zu unterscheiden.',visit:'Historisch belegte Orte sollten von modernen touristischen Bezeichnungen unterschieden werden. Nicht gesicherte Standorte dürfen nicht als Tatsachen dargestellt werden.',source:'Sahih al-Bukhari und Sahih Muslim, Bericht Aischas über den schwersten Tag des Propheten ﷺ; Sira-Literatur.'}}
];
let lang='sq',city='all';const el=id=>document.getElementById(id);
function setLang(v){stopSpeech();lang=v;document.documentElement.lang=v;el('sq').classList.toggle('active',v==='sq');el('de').classList.toggle('active',v==='de');render()}
function setCity(v){city=v;['all','medine','meke','taif'].forEach(x=>el(x).classList.toggle('active',x===v));render()}
function stopSpeech(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function speak(id){stopSpeech();if(!('speechSynthesis'in window)){alert(lang==='sq'?'Leximi me zë nuk mbështetet.':'Sprachausgabe wird nicht unterstützt.');return}const p=places.find(x=>x.id===id);if(!p)return;const t=p[lang];const u=new SpeechSynthesisUtterance([t.title,t.intro,t.history,t.significance,t.visit].join('. '));u.lang=lang==='sq'?'sq-AL':'de-DE';u.rate=.9;window.speechSynthesis.speak(u)}
function render(){el('heading').textContent=lang==='sq'?'Vizitat historike':'Historische Besichtigungen';el('intro').textContent=lang==='sq'?'Udhëzues dygjuhësh për vendet e lidhura me historinë islame. Shpjegime, orientim dhe lexim me zë.':'Zweisprachiger Reiseführer zu Orten der islamischen Geschichte – mit Erklärungen, Navigation und Vorlesefunktion.';el('stop').textContent=lang==='sq'?'■ Ndalo leximin':'■ Vorlesen stoppen';el('all').textContent=lang==='sq'?'Të gjitha':'Alle';el('medine').textContent=lang==='sq'?'Medinë':'Medina';el('meke').textContent=lang==='sq'?'Mekë':'Mekka';el('cards').replaceChildren(...places.filter(p=>city==='all'||p.city===city).map(p=>{const t=p[lang],a=document.createElement('article');a.className='card';const cityLabel={medine:'Medina',meke:'Mekka',taif:'Taif'}[p.city];const tag=document.createElement('div');tag.className='tag';tag.textContent=cityLabel;a.append(tag);const h=document.createElement('h2');h.textContent=t.title;a.append(h);for(const [label,key] of (lang==='sq'?[['Përmbledhje','intro'],['Historia','history'],['Rëndësia','significance'],['Udhëzime për vizitën','visit']]:[['Überblick','intro'],['Geschichte','history'],['Bedeutung','significance'],['Hinweise zum Besuch','visit']])){const h3=document.createElement('h3');h3.textContent=label;const body=document.createElement('p');body.textContent=t[key];a.append(h3,body)}const src=document.createElement('p');src.className='sources';src.textContent=(lang==='sq'?'Referenca për verifikim: ':'Quellen zur Prüfung: ')+t.source;a.append(src);const actions=document.createElement('div');actions.className='actions';const b=document.createElement('button');b.textContent=lang==='sq'?'▶ Lexo me zë':'▶ Vorlesen';b.onclick=()=>speak(p.id);const m=document.createElement('a');m.className='map';m.href=p.map;m.target='_blank';m.rel='noopener noreferrer';m.textContent=lang==='sq'?'Hap hartën':'Karte öffnen';actions.append(b,m);a.append(actions);return a}))}
render();
</script></body></html>
